[workspace]
members  = [
  "crates/hook",
  "crates/loader",
  "crates/patcher",
  "crates/runtime",
  "crates/sigs",
  "crates/sigscan",
  "crates/stand-in",
  "crates/stand-in-demo",
  "crates/ui",
  "crates/wire",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
android_logger  = { default-features = false, version = "0.15" }
bindgen         = "0.73"
cc              = "1"
crc32fast       = "1"
dobby-rs        = "0.1"
flub            = "0.1"
jni-sys         = "0.4"
libc            = "0.2"
log             = "0.4"
memchr          = "2"
misstep         = { features = [ "panic-hook", "pretty" ], version = "0.4.1" }
object          = { default-features = false, features = [ "elf", "read_core", "std" ], version = "0.41" }
phoenix-hook    = { path = "crates/hook" }
phoenix-runtime = { path = "crates/runtime" }
phoenix-sigs    = { path = "crates/sigs" }
phoenix-ui      = { path = "crates/ui" }
phoenix-wire    = { path = "crates/wire" }
rquickjs        = { features = [ "parallel" ], version = "0.14" }
serde           = { features = [ "derive" ], version = "1" }
serde_json      = { features = [ "raw_value" ], version = "1" }
zip             = { default-features = false, version = "9" }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
nursery  = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

missing_errors_doc = "allow"
missing_panics_doc = "allow"

[profile.release]
codegen-units = 1
lto           = "fat"
panic         = "unwind"
strip         = true

[profile.dev-fast]
inherits      = "release"
codegen-units = 16
lto           = false
opt-level     = 1
strip         = "debuginfo"
