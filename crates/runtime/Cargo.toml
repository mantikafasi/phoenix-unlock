[package]
name              = "phoenix-runtime"
description       = "QuickJS plugin runtime that drives phoenix's gateway hooks"
edition.workspace = true
license.workspace = true
version.workspace = true

[dependencies]
flub         = { workspace = true }
log          = { workspace = true }
phoenix-hook = { workspace = true }
phoenix-sigs = { workspace = true }
phoenix-ui   = { workspace = true }
rquickjs     = { workspace = true }
serde        = { workspace = true }
serde_json   = { workspace = true }

[target.'cfg(any(target_os = "android", target_os = "ios"))'.dependencies]
# rquickjs-sys ships pregenerated bindings for desktop triples only.
rquickjs = { features = [ "bindgen" ], workspace = true }

[target.'cfg(target_os = "android")'.dependencies]
crc32fast    = { workspace = true }
jni-sys      = { workspace = true }
libc         = { workspace = true }
memchr       = { workspace = true }
phoenix-wire = { workspace = true }

[lints]
workspace = true
